version: 0.2

phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 817615305328.dkr.ecr.us-east-1.amazonaws.com
      - REPOSITORY_URI=817615305328.dkr.ecr.us-east-1.amazonaws.com/rsimkhad-agent
      - IMAGE_TAG=latest

  build:
    commands:
      - docker build -t $REPOSITORY_URI:$IMAGE_TAG .

  post_build:
    commands:
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - printf '[{"name":"rsimkhad-agent","imageUri":"%s"}]' "$REPOSITORY_URI:$IMAGE_TAG" > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
